# Ловец-Кинцуги — конфиг. Правится прямо на GitHub (файл → карандаш → commit).

[bot]
daily_leads      = 3         # сколько лидов выдавать в день (3 — точечный outreach, не спам)
lead_hour_msk    = 10        # порция дня выдаётся при первом запуске после этого часа
active_hours_msk = [9, 22]   # вне этих часов (МСК) запуск сразу выходит

[kp]
portfolio_url = "https://kingtsugi.ru"
author_name   = "Егор Сафонович"
brand         = "KingTsugi"
author_phone  = "+7 909 676-69-91"
author_tg     = "@SAFonovich"
subject       = "Кинцуги-тимбилдинг — формат, которого нет у конкурентов ({company})"

# PDF-КП, прикладывается к первому письму (путь от корня репо; имя — как увидит получатель)
attachment      = "assets/kp.pdf"
attachment_name = "KingTsugi — коммерческое предложение.pdf"

# Цены и формат — вшиты в КП и переговоры. Меняются здесь.
prices = """— Корпоративный мастер-класс кинцуги: 2–3 часа, группа до 12 человек — от 40 000 ₽ (≈3 300 ₽/чел — меньше среднего чека на картинг)
— Группы 10–20 человек, больше — разбиваем на потоки, считаем индивидуально
— По желанию: чайная церемония в дополнение (+1,5–2 часа)
Выезд в офис/лофт, все материалы, инструменты и фартуки включены."""

payment = "Работаю без менеджеров и предоплатных схем — условия и договор обсуждаем напрямую."

# Шаблон-запаска: используется, если нейросеть недоступна
template = """Добрый день!

Меня зовут Егор Сафонович — я мастер кинцуги, веду корпоративные
мастер-классы в Москве. Кинцуги — японское искусство восстановления
разбитой керамики золотом: команда 2–3 часа работает руками, и каждый
уходит с предметом, который восстановил сам. Никакого опыта не нужно.

Почему это работает там, где escape room и кулинария уже не удивляют:
это редкость (живых мастеров кинцуги в Москве — единицы, я веду
реставрационную мастерскую и работаю с японскими материалами ежедневно),
в этом есть смысл («сломанное становится красивее целого» — метафора,
которую команды после сложного периода чувствуют без объяснений),
и это остаётся — предмет стоит дома у каждого участника дольше,
чем живёт любое командное фото.

Формат и цены:
{prices}

{payment}

Подробное коммерческое предложение — во вложении (PDF), сайт: {portfolio}
Если формат интересен — напишите, отвечу на вопросы.
Отвечаю сам, быстро.

{author}
{portfolio} · {tg} · {phone}"""

[llm]
enabled  = true              # персонализация КП + черновики ответов
provider = "chad"            # ChadGPT (подписка SAF) · "openai" = OpenRouter/AITunnel · "anthropic" = Claude
api_base = "https://openrouter.ai/api/v1"   # используется только для provider="openai"
model    = "claude-3.7-sonnet"   # у Chad; запасной: gpt-5.2. Для openai: qwen/qwen3-next-80b-a3b-instruct:free
fallback_models = [
  "meta-llama/llama-3.3-70b-instruct:free",
  "google/gemma-4-31b-it:free",
  "openai/gpt-oss-20b:free",
]
# ключ — в секрете GitHub LLM_API_KEY

[email]
enabled   = true
smtp_host = "smtp.gmail.com"   # отправка с safpelerin@gmail.com
smtp_port = 465
imap_host = "imap.gmail.com"   # чтение ответов
# логин/пароль приложения — в секретах GitHub: SMTP_USER, SMTP_PASS

[negotiation]
enabled = true   # ответы компаний: LLM готовит черновик, отправка по кнопке в TG

[followup]
enabled    = true
after_days = 4   # нет ответа N дней → одно вежливое напоминание (уходит само)
template = """Добрый день!

Несколько дней назад отправлял предложение по корпоративному
мастер-классу кинцуги для {company} — на случай, если письмо затерялось,
коротко продублирую: японское искусство восстановления керамики золотом,
2–3 часа работы руками, выезд к вам, всё включено. Детали и фото:
{portfolio}

Если не актуально сейчас — просто не отвечайте, больше не потревожу.
Если интересно — пришлю презентацию.

{author}
{phone}"""
