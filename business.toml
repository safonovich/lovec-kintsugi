# ─────────────────────────────────────────────────────────────────────
# Описание бизнеса. Это единственный файл, который нужно заполнить,
# чтобы запустить ловца под новое дело. Всё остальное — поисковые
# запросы, пороги запаса — берётся отсюда.
# ─────────────────────────────────────────────────────────────────────

[business]
name       = "KingTsugi"
what       = "корпоративные мастер-классы по кинцуги — японской реставрации керамики золотом"
who_i_am   = "Егор, мастер кинцуги, мастерская в Химках"
client     = "event-агентства, HR и отделы внутренних коммуникаций компаний Москвы"
city       = "Москва и Московская область"
value      = "команда два часа чинит разбитое своими руками и уносит предмет с собой — тимбилдинг, который остаётся на полке"

[search]
# Запросы для веб-поиска. Пишите так, как искали бы клиента сами.
# Курсор крутится по списку, так что чем их больше, тем дольше
# поиск не начнёт возвращать одно и то же.
queries = [
  "event агентство Москва корпоративные мероприятия",
  "организация тимбилдинга Москва компания",
  "агентство корпоративных мероприятий Москва услуги",
  "организация корпоративов для компаний Москва",
  "мастер-классы для сотрудников компании Москва заказать",
  "творческие мастер-классы на корпоратив Москва",
  "event агентство тимбилдинг под ключ Москва",
  "агентство делового туризма и мероприятий Москва",
  "организация новогоднего корпоратива Москва агентство",
  "корпоративные подарки ручной работы Москва компания",
  "ивент агентство Москва заказать мероприятие",
  "организация мероприятий для сотрудников компании Москва",
  "необычный тимбилдинг Москва заказать",
  "выездной мастер-класс для компании Москва",
  "мастер-класс на корпоратив ведущий Москва заказать",
  "агентство event маркетинга Москва услуги",
  "организация корпоративных мероприятий Московская область",
  "организация праздников для компаний Химки Красногорск",
  "HR агентство корпоративная культура Москва",
  "развитие корпоративной культуры Москва компания услуги",
  "корпоративные подарки ручной работы на заказ Москва",
  "бизнес-подарки партнёрам компании Москва",
  "гончарный мастер-класс для компании Москва",
  "организация деловых мероприятий и конференций Москва",

  # Рядом с мастерской: площадки, а не клиенты. Они рекомендуют формат.
  "загородный клуб Новогорск Химки мероприятия для компаний",
  "отель Химки Новогорск конференц-зал проведение мероприятий",
  "бизнес-центр Химки Куркино аренда офисов",
  "коворкинг Химки Куркино Новогорск",
  "арт-пространство Куркино Химки мастер-классы аренда",
  "ресторан банкетный зал Куркино Новогорск мероприятия",
  "организация мероприятий Долгопрудный Зеленоград Красногорск",

  # Команды и стартапы: тимбилдинг они зовут иначе.
  "IT компания Москва корпоративная культура команда",
  "технопарк Москва резиденты компании",
  "акселератор и бизнес-инкубатор Москва стартапы",
  "коворкинг Москва мероприятия для резидентов",
  "организация стратегических сессий для команды Москва",
  "офлайн встреча команды Москва организация ретрита",

  # Смежные покупатели: тот же бюджет, другие слова.
  "wellness программы для сотрудников компании Москва",
  "арт-терапия и творческие практики для команд Москва",
  "агентство корпоративного мерча и подарков Москва",
  "антикафе творческое пространство Москва аренда зала",
  "свадебное агентство Москва организация праздников под ключ",
]
gl             = "ru"
hl             = "ru"
max_pages      = 5
fetch_contacts = true

[replenish]
min_new_leads  = 100     # сколько доступных лидов держать в запасе
batch_size     = 50      # потолок кандидатов за один подход
buffer_percent = 30      # искать с запасом: часть окажется дублями
max_attempts   = 3       # попыток за прогон — защита от зацикливания
